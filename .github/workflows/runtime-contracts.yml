# runtime-contracts — runtime-rebuild 的检查资产 CI（格式/结构/契约检查 + 根 module 产品编译门，不跑真实资源）。
#
# 三类证据严格分开，本 workflow 默认只覆盖前两类：
#   1) 格式/规范有效：计划、政策表、场景合同可解析且自洽（contracts job，默认）。
#   2) 结构覆盖有效：仅经 workflow_dispatch 显式选择 run_implementation=true 后运行
#      architecture --implementation（需要可编译的一方差树；缺包在此为诚实红，不掩盖）。
#   3) 运行行为有效：仅当 dispatch 显式给出 --evidence/--test-log 时才做对照。
#
# real-acceptance job 仅当显式选择（run_implementation=true 或提供 evidence/test_log）时才开；
# 皆空则根本不跑（不把空 dispatch 冒充空绿）。evidence_json 与 test_log 必须成对提供，
# 只给一半即失败，不静默跳过。输入经 env 传入，绝不插值进带引号的 shell 参数。
#
# 产品门（随 00.6 迁移进本 workflow，与本地验证同口径；Go ≥1.24.1）：根 module 的
# go build ./...、go vet ./...、go test ./... -short -count=1，产品包上的 gofmt -l、
# comment_policy -no-baseline、codetools tracked-hygiene，加 openspec strict。
# 产品包口径 = golden/runtime/architecture.json 登记的第一方包（其 scope 明确排除
# scripts/tests/examples/docs/resources）；PRODUCT_PACKAGES 的顶层目录集由
# scripts/gates/test_check_runtime_workflow.py 对 golden 钉住，防漂移。根包用 *.go 是因为
# `gofmt -l .`/`comment_policy .` 会递归整个根 module（含 scripts/tests）。
#
# 多 module 现状：examples/wechat-bot 与 examples/cli-host 都是独立 module（无 go.work，
# 根 module 的 ./... 到不了它们），各自可编译并通过自身测试——以 `git archive HEAD`
# 的干净树实测：
#   go -C examples/wechat-bot  build ./... / vet ./... / test ./... -short -count=1 → RC=0
#   go -C examples/cli-host    build ./... / vet ./... / test ./... -short -count=1 → RC=0
# 这些步骤由 ci.yml 的 Build/Vet/Test (bot module) 与 Build/Vet/Test (cli-host module)
# 承担；本 workflow 只管根 module 产品门，不重复示例 module 步骤（重复会造两处升级点）。
#
# 本 workflow 不代表产品行为通过；openspec strict 步骤以 `--specs` 只校验主规格
# （openspec/specs/ 是唯一真源；in-flight change 属 WIP，由 scripts/gates/check-openspec.sh
# 报告而不判红），任一主规格未 strict-valid 即如实红。不替代 ci.yml/lint.sh/
# race_check.sh/gen_godoc.sh。不使用 continue-on-error，不内嵌第二套校验器；检查器本体
# 纯标准库，只有 workflow 自测解析本文件需要 PyYAML（自测步骤安装这一件）。
name: runtime-contracts

on:
  push:
    branches: [main, dev, next]
  pull_request:
  workflow_dispatch:
    inputs:
      run_implementation:
        description: "Run architecture --implementation coverage (requires a buildable first-party tree)."
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
      evidence_json:
        description: "Path to a runner evidence JSON (records + source_fingerprint)."
        type: string
        default: ""
      test_log:
        description: "Path to the matching real go test -json JSONL log."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  contracts:
    name: format-and-contract
    runs-on: ubuntu-latest
    env:
      # First-party product packages per golden/runtime/architecture.json (its
      # scope excludes scripts/tests/examples/docs/resources). The root
      # package is *.go: a bare `.` would recurse the whole root module.
      PRODUCT_PACKAGES: "*.go api runtime memory features tool internal cli"
    steps:
      # Full history: doc-refs citation-level anchors resolve at their introducing commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Checker selftests are pure Python; the product gates below additionally
      # need the Go toolchain (floor >=1.24.1) and the pinned openspec CLI.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.24.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install openspec
        # Same pin as ci.yml and local validation (1.2.0).
        run: npm install -g @fission-ai/openspec@1.2.0

      # The checkers themselves stay pure stdlib; only the workflow selftest
      # parses this YAML, so PyYAML is installed here and nowhere else.
      - name: Checker selftests
        run: |
          python -m pip install --quiet pyyaml
          python -m unittest discover -s scripts/gates -p 'test_check_runtime_*.py' -v
          python scripts/gates/test_check_concept_budget.py -v

      # Fails honestly while the domain artifacts are still being written; no bypass.
      - name: Plan contract
        run: "if compgen -G 'openspec/changes/*/task-graph.json' > /dev/null; then python scripts/gates/check_runtime_plan.py --change-dir openspec/changes/archive/2026-10-18-runtime-rebuild --json; else echo 'no active change; the plan contract gate has no object (archive-only), skipped'; fi"

      - name: Architecture policy
        run: "python scripts/gates/check_runtime_architecture.py --check-policy --json"

      # 概念预算（S1–S4，concept-slim-plan.md §一）：多态接口 ≤2 方法 / 消费者侧窄口 ≤3 /
      # 导出结构 ≤5 导出字段 / 裸 ctx.Value=0 / 每窄口 canonical 范例＋MUST/MUST NOT 红线清单。
      # baseline 是检查器文件内的显式债务表（只降不升）：命中豁免仍 warn 计数，豁免表外的
      # 新增超标即 error。与 Architecture policy 同链、同 exit 语义（0 过 / 1 findings）。
      - name: Concept budget (S1–S4)
        run: "python scripts/gates/check_concept_budget.py --json"

      - name: Architecture implementation coverage
        run: "python scripts/gates/check_runtime_architecture.py --implementation --json"

      - name: Scenarios contract
        run: "if compgen -G 'openspec/changes/*/task-graph.json' > /dev/null; then python scripts/gates/check_runtime_evidence.py --check-contract --plan-graph openspec/changes/archive/2026-10-18-runtime-rebuild/task-graph.json --json; else echo 'no active change; the scenarios contract gate has no object (archive-only), skipped'; fi"

      # ---- root-module product gates (same scope as local verification) ----
      - name: Build (root module)
        run: go build ./...

      - name: Vet (root module)
        run: go vet ./...

      - name: Test (root module, short)
        run: go test ./... -short -count=1

      - name: gofmt (product packages)
        run: |
          out="$(gofmt -l $PRODUCT_PACKAGES)"
          if [ -n "$out" ]; then
            printf '%s\n' "$out"
            echo "::error::gofmt found unformatted product files"
            exit 1
          fi

      # -no-baseline only measures (its exit stays 0 even with findings), so the
      # gate asserts the count itself and fails closed when it cannot parse one.
      - name: Comment policy (product packages, measurement mode)
        run: |
          out="$(go run ./scripts/comment_policy -no-baseline $PRODUCT_PACKAGES)"
          printf '%s\n' "$out"
          count="$(printf '%s\n' "$out" | sed -n 's/^comment_policy: \([0-9][0-9]*\) finding(s).*/\1/p')"
          if [ "$count" != "0" ]; then
            echo "::error::comment_policy reported '${count:-unparsed}' finding(s) over product packages"
            exit 1
          fi

      - name: Tracked hygiene
        run: go run ./scripts/codetools tracked-hygiene

      - name: OpenSpec strict (main specs)
        # 该步以 `--specs` 校验全部主规格；任一主规格未 strict-valid 时如实红，不以 continue-on-error 掩盖。
        run: openspec validate --specs --strict --no-interactive

  real-acceptance:
    name: explicit-real-acceptance
    # Dispatch-only and strictly opt-in: with no real input selected the job does
    # not run at all, so an empty dispatch can never masquerade as a green real
    # run. Selecting it means exercising real structure (run_implementation) or
    # real evidence (evidence_json/test_log).
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_implementation == 'true' || inputs.evidence_json != '' || inputs.test_log != '') }}
    runs-on: ubuntu-latest
    steps:
      # Full history: doc-refs citation-level anchors resolve at their introducing commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Half a real-acceptance input is a parameter error: never fall through to
      # a silent "nothing to compare" success.
      - name: Reject partial real-acceptance inputs
        if: ${{ (inputs.evidence_json != '') != (inputs.test_log != '') }}
        run: |
          echo "::error::supply both evidence_json and test_log, or neither"
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-go@v5
        if: ${{ inputs.run_implementation == 'true' }}
        with:
          go-version: ">=1.24.1"

      # Real structural coverage over `go list -deps -json ./...`. Left dispatch-only:
      # the current tree still lacks deps, so a missing package here is an honest red
      # (never masked, never continue-on-error) — it is only not run by default, to
      # keep the default signal about format/contract alone.
      - name: Architecture implementation coverage
        if: ${{ inputs.run_implementation == 'true' }}
        run: "python scripts/gates/check_runtime_architecture.py --implementation --json"

      # Real evidence comparison: both artifacts must be supplied explicitly and
      # are injected via env (never interpolated into a quoted shell argument), so
      # a crafted path can neither break out of quoting nor be word-split.
      - name: Evidence verification
        if: ${{ inputs.evidence_json != '' && inputs.test_log != '' }}
        env:
          EVIDENCE_JSON: ${{ inputs.evidence_json }}
          TEST_LOG: ${{ inputs.test_log }}
        run: python scripts/gates/check_runtime_evidence.py --evidence "$EVIDENCE_JSON" --test-log "$TEST_LOG" --json

      - name: Note when no evidence was compared
        if: ${{ inputs.evidence_json == '' }}
        run: echo "no evidence/test-log supplied; this run verified structure only, not runtime behaviour"
