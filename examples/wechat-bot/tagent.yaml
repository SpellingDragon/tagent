# ============================================================================
# tagent WeChat Bot 配置文件 (Single Source of Truth)
# ============================================================================
# 分层:tagent YAML(agent 定义) · providers(连接注册表) · ToolRef.Remote(A2A 连接)。
# 敏感信息(API Key)一律经环境变量注入,不写此文件。
#
# 编排约定(消除冗余,语义等价):
#   · 全局 provider/model 为默认值 —— agent 省略即回退全局(见 config.go resolveAgentModel),
#     仅 plan 覆盖 model。改全局默认即改全体,无需逐 agent 重复。
#   · x-anchors 定义共享锚点(&),下方 *引用 —— 被 tagent 配置解析忽略(yaml.v3 非 strict),
#     仅用于消除 engine/exec-monitor 的逐字重复,解析结果与展开写值逐字段等价。
#
# 平台子系统(治理/自进化/可靠性/语义召回)启用后的**行为详情**见:
#   docs/wiki/platform/agent-behavior-matrix.md(分场景溯源代码) + platform-subsystems.md
# ============================================================================

# ===== 全局默认(agent 省略 provider/model 时回退此)=====
provider: zhipu                                              # providers 注册表键(智谱 GLM,openai 兼容协议)
model: glm-5.3-flash                                         # 主模型;plan 覆盖为 glm-5.3
api_endpoint: "https://open.bigmodel.cn/api/coding/paas/v4"  # 全局 fallback(providers.zhipu 已含同端点)
log_level: "info"                                            # debug 打印 LLM 明文,远端不宜;排障用 ./run.sh -d 或 LOG_LEVEL=debug
request_timeout_seconds: 3600
trajectory_dump: true                                        # 每次 LLM 调用记录 JSONL(SFT/RL 训练用)
trajectory_dir: "data/trajectories"

# agent 统一工作根:file tools 的 base_dir 与 exec 命令 cwd 的**共同基准**(二者恒一致 = 模型单一文件系统视图)。
# 空(默认)= 继承进程工作目录(部署目录);设为项目 clone 根(如 /home/user/codes)→ agent 可操作该目录下所有
# 仓库,而 tagent 自身配置/资源/数据路径不受影响(仍相对进程 cwd)。优先级:properties.base_dir/workspace > 此 > 进程 cwd。
# 部署时**推荐用环境变量 TAGENT_WORKING_DIR 指定**(免改本文件、随 clone 位置灵活;见 .env.example + deploy/README.md)。
# working_dir: /home/user/codes

# ===== Provider 连接注册表 =====
# provider 字段 = 协议实现(openai 兼容 / anthropic / gemini / ollama / hunyuan);国内模型多用 openai 兼容,以 api_endpoint 区分。
providers:
  zhipu:      { provider: openai, api_endpoint: "https://open.bigmodel.cn/api/coding/paas/v4", api_key_env: "ZAI_API_KEY" }
  deepseek:   { provider: openai, api_endpoint: "https://api.deepseek.com/v1",                 api_key_env: "DEEPSEEK_API_KEY" }
  moonshot:   { provider: openai, api_endpoint: "https://api.moonshot.cn/v1",                  api_key_env: "MOONSHOT_API_KEY" }
  tencent_hy: { provider: openai, api_endpoint: "https://api.lkeap.cloud.tencent.com/plan/v3", api_key_env: "TENCENT_HY_API_KEY" }
  tencent:    { provider: openai, api_endpoint: "https://tokenhub.tencentmaas.com/v1",         api_key_env: "TENCENT_API_KEY" }
  # 私有协议按需启用:
  # anthropic: { provider: anthropic, api_endpoint: "https://api.anthropic.com", api_key_env: "ANTHROPIC_API_KEY" }
  # gemini:    { provider: gemini, api_key_env: "GOOGLE_API_KEY" }

# ===== MCP Servers(声明式;增删本段热生效 mtime 惰性同步,免重启,不动工具声明区→prefix-cache 稳定)=====
mcp_servers:
  web-search-prime:
    transport: streamable-http                              # 归一化为 trpc "streamable"
    url: https://open.bigmodel.cn/api/mcp/web_search_prime/mcp
    api_key_env: ZAI_API_KEY                                # GLM Coding Plan 专属,复用同一把 key

# ===== 平台子系统(默认关闭=零行为变化;此处按远端常驻部署启用。行为详情见 agent-behavior-matrix.md)=====
governance:                    # 治理闸:leaf 工具过闸 classify→critical批准→goal→预算→记账
  enabled: true
  enforcement: warn            # warn(记账放行,推荐起步) | strict(拒绝);critical 恒需人工批准(不受此放松)
  dir: data/governance         # budget+approvals 持久化(重启不丢;空=纯内存)
  budget_window_minutes: 60
  max_high_risk: 20            # 窗口内 high 上限(per-agent 独立预算)
  max_medium_risk: 200
  # goal_required_for: []      # 留空=不启用 goal 门(goal_declare 工具未交付,见 gate.go A7)

evolution:                     # git 原生自进化:文件即真源(热重载)+git 版本层+建议式评估
  enabled: true                # 裁决:example 演示完整自迭代特性。⚠ 生产=独立部署仓;
                               # 在源码仓内跑 bot,refine register 的改进 commit 会落入源码仓,自担
  # protected_paths: ["resources/prompts/**", "skills/**", "scripts/**"]   # register 受控清单(默认即此三目录)
  # judge_delay_seconds: 1800  # register 后评估延迟窗(0=立即;建议≥30m 收集 feedback 样本)
  # judge_min_samples/judge_pass_threshold/judge_timeout_seconds 省略走默认(5 / 0.5 / 60s)

reliability:                   # 常驻可靠性:不丢事件+退化可观测+重启稳定(per-agent 隔离;各 dir 空则回退内存/channel)
  bus_spill_dir: data/reliability/bus             # 事件总线 channel 满溢出落盘(at-least-once)
  mem_spill_dir: data/reliability/memspill        # StoreEvent 失败兜底,memory 恢复重放(幂等)
  meditation_anchor_dir: data/reliability/anchors # 冥想锚点持久化(重启不误触发)
  degradation_enabled: true                       # 五依赖(memory/disk/rustviking/model/mcp)退化-恢复状态机

# ===== 共享锚点(被配置解析忽略;供下方 *引用,解析结果与逐字展开等价)=====
x-anchors:
  # 语义引擎:tagent/knowledge/recall 三 agent 共享 —— cacheKey(path|backend|model|dims)一致
  # → namedEngines 同一实例,保跨 agent 召回一致。缺 ZAI_API_KEY 时优雅降级纯关键词(不阻断)。
  # 512 维 = X2 实测决议(分离度≈1024 而成本减半)。融合:向量 topK ∪ 关键词 topK → RRF(k=60)。
  engine: &shared_engine
    backend: memory                                          # MVP 内存向量索引;localfile 时向量序列化入底层 KV + 启动重建
    embedding: { provider: zhipu, model: embedding-3, api_key_env: ZAI_API_KEY, dimensions: 512 }
    vector_top_k: 20
    keyword_top_k: 20
    rrf_k: 60
  # exec 工具的 tmux 监控参数(tagent/action 共享)。
  exec_monitor: &exec_monitor
    interval: 3s
    stable_duration: 30s
    fake_dead_duration: 180s

# ===== Agent 配置 =====
# thinking_enabled(GLM/Claude/Gemini honor;hy3 忽略) · reasoning_effort(hy3/o-series 思考开关) ·
# reasoning_content_mode(keep_all / discard_previous 默认 / discard_all)。子 agent 运行参数在其自身定义处。
entry: tagent
prompt_dir: resources/prompts

agents:
  # ---- 顶层主 Agent(微信助手)----
  tagent:
    # provider/model 省略 → 回退全局(zhipu / glm-5.3-flash)
    system_prompt:
      files: [AGENTS.md, SOUL.md, USER.md, TOOLS.md]
    memory:
      type: localfile
      path: .wechat-config/data          # 共享持久存储(knowledge/recall 同 path = 同一 FileSegmentStore 实例)
      engine: *shared_engine             # 语义召回(见 x-anchors)
    max_tool_iterations: 300
    max_tokens: 128000
    temperature: 0.7
    thinking_enabled: true
    compress_threshold: 0.8
    keep_recent_tasks: 4
    task_terminal_ttl: "30m"             # 终态任务保留期 = resume 重入窗(plan 生命周期依赖,故调大;默认 2m)
    compress:
      summary_model: glm-5.3-flash       # L3 滚动综述 + 卡片浓缩(无模型/失败降级纯工程)
      summary_provider: zhipu
      summary_max_tokens: 8192           # 摘要输出预算下限(推理模型耗思考链,不足会空 Content 塌缩)
    tools:
      - agent: knowledge                 # 知识获取/翻译;event_keys 由 wrapper 从父 memStore 还原完整事件
        description_file: knowledge_tool_desc.md
        event_params: [event_keys]
      - kind: tool                       # 统一召回入口(items 票据 / turn_key 因果链 / query 检索)
        id: recall
      - agent: plan                      # 工作计划管理(拆解/记账/归档审计,不代工)
        description_file: plan_tool_desc.md
        extra_params:
          - { name: action, enum: [create, update, archive, progress], description: "操作类型" }
          - { name: name, description: "计划名(kebab-case)；update/progress/archive 必填" }
      # File Tools(相对路径基准 = 进程 cwd,与 exec 一致 → 模型看到单一文件系统视图)
      - { kind: tool, id: read_file }
      - { kind: tool, id: list_file }
      - { kind: tool, id: search_file }
      - { kind: tool, id: search_content }
      - { kind: tool, id: read_multiple_files }
      - { kind: tool, id: save_file }
      - { kind: tool, id: replace_content }
      - kind: tool                       # exec:shell 异步执行(经 tmux)
        id: exec
        description_file: exec_tool_desc.md
        properties:
          monitor: *exec_monitor
      # 远程 A2A 子 agent 示例:声明 remote.url 即可,tagent.go 自动建 A2AAgent + TransferStateKey
      # - agent: remote-knowledge
      #   description_file: knowledge_tool_desc.md
      #   event_params: [event_keys]
      #   remote: { url: "http://knowledge-service:8088" }
    meditation:                          # 定时心跳(仅 entry):空闲触发上下文清理/深度分析/skill 积累
      enabled: true
      interval: "30m"
      min_gap: "2h"
      prompt_file: "meditation.md"

  # ---- Knowledge:知识获取 & 翻译子 Agent ----
  knowledge:
    system_prompt:
      files: [knowledge_agent.md]
    memory:
      type: localfile
      path: .wechat-config/data
      read_namespaces: [tagent]          # 授权读主 agent 时间线(自身命名空间恒可读)
      engine: *shared_engine
    max_tool_iterations: 30
    max_tokens: 32000
    temperature: 0.3
    thinking_enabled: true
    reasoning_effort: "low"              # hy3 思考触发器(thinking_enabled 对 hy3 无效)
    tools:
      - { kind: tool, id: skill_search }
      - { kind: tool, id: skill_load }
      - { kind: tool, id: read_file }    # 只读知识库(不扩权:无 list/search/exec/write)
      - { kind: tool, id: mcp_discover }
      - { kind: tool, id: mcp_call }     # 经网关直调 web-search-prime(实测工具名 web_search_prime)
      - { kind: tool, id: duckduckgo_search }
      - { kind: tool, id: memory_query }

  # ---- Recall:记忆检索子 Agent ----
  recall:
    system_prompt:
      files: [recall_agent.md]
    memory:
      type: localfile
      path: .wechat-config/data
      read_namespaces: [tagent]
      engine: *shared_engine             # recall_query 走 hybrid 融合(向量∪关键词 RRF)
    max_tool_iterations: 5
    max_tokens: 32000
    tools:
      - { kind: tool, id: recall_query }
      - { kind: tool, id: recall_get }
      - { kind: tool, id: recall_recent }
      - { kind: tool, id: recall_trace }

  # ---- Action:执行中枢(调度 file/exec/mcp)----
  action:
    system_prompt:
      files: [action_agent.md]
    memory:
      type: memory
    max_tool_iterations: 50
    max_tokens: 32000
    temperature: 0.3
    thinking_enabled: true
    reasoning_effort: "low"
    tools:
      - { kind: tool, id: read_file }
      - { kind: tool, id: list_file }
      - { kind: tool, id: search_file }
      - { kind: tool, id: search_content }
      - { kind: tool, id: read_multiple_files }
      - { kind: tool, id: save_file }
      - { kind: tool, id: replace_content }
      - kind: tool
        id: exec
        description_file: exec_tool_desc.md
        properties:
          monitor: *exec_monitor
      - { kind: tool, id: mcp_call }     # MCP 执行网关(发现经 knowledge mcp_discover)

  # ---- Plan:工作计划管理子 Agent(openspec CLI,无通用 shell 逃逸面)----
  plan:
    model: glm-5.3                       # 覆盖全局 flash(plan 需更强推理)
    thinking_enabled: true
    system_prompt:
      files: [plan_agent.md]
    memory:
      type: memory
    max_tool_iterations: 50
    max_tokens: 64000
    temperature: 0.3
    tools:
      - kind: tool                       # spec:类型化计划管理(后端 openspec CLI,argv 直调,无 shell)
        id: spec
        properties: { bin: openspec }    # work_dir 缺省 = 进程 cwd(含 openspec/)
      # 读全工程(做计划需看代码/文档)
      - { kind: tool, id: read_file }
      - { kind: tool, id: list_file }
      - { kind: tool, id: search_file }
      - { kind: tool, id: search_content }
      - { kind: tool, id: read_multiple_files }
      # 写类工具 base_dir 沙箱锁定 openspec/(上游 ToolSet 拒绝 ../ 与绝对路径逃逸)
      - kind: tool
        id: save_file
        properties: { base_dir: openspec }
      - kind: tool
        id: replace_content
        properties: { base_dir: openspec }

# ===== 应用专属配置(各应用自行反序列化)=====
app:
  wechat:
    config_dir: ".wechat-config"
    token_file: "token.json"
    context_token_dir: ".wechat-context-tokens"
    workspace_dir: ".tagent-workspace"   # 入站附件/长文本落盘(容器内 TAGENT_WECHAT_WORKSPACE_DIR 覆盖)
