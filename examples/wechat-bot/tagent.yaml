# ============================================================================
# tagent WeChat Bot 配置文件 (Single Source of Truth)
# ============================================================================
#
# 所有配置统一在此文件中管理，无需维护多份配置文件。
#
# 配置分层说明:
#   - tagent YAML: agent 定义（模型、供应商、超参、prompt、event_params）
#   - providers: 供应商连接信息注册表（endpoint, api_key_env）
#   - ToolRef.Remote: 连接信息（remote.url = "这个 agent 在哪里"）
#   - trpc Go options: 通信细节（A2A 协议、TransferStateKey）— tagent.go 内部自动生成
#
# 多供应商支持:
#   每个 agent 可通过 provider 字段引用不同的模型供应商（openai/anthropic/gemini/ollama/hunyuan）
#   示例: knowledge agent 使用 Anthropic Claude，其他 agent 使用智谱 GLM
#
# 敏感信息:
#   API Key 通过环境变量设置，不要写在此文件中
# ============================================================================

# ===== 运行时配置 =====

# 全局默认 provider (不填则默认 "openai")
# 支持 5 种 provider 实现:
#   openai    — OpenAI 兼容协议（OpenAI / 智谱 GLM / DeepSeek / Moonshot / Baichuan / 通义千问等）
#   anthropic — Anthropic Claude 原生协议
#   gemini    — Google Gemini 原生协议
#   ollama    — Ollama 本地模型
#   hunyuan   — 腾讯混元原生协议
# 注意: 大多数国内模型（GLM、DeepSeek、Kimi 等）都使用 OpenAI 兼容 API，
#       因此 provider 应填 "openai"，通过 api_endpoint 区分具体供应商。
provider: openai

# LLM 模型 (所有 agent 的默认模型，各 agent 可单独覆盖)
model: glm-5
# LLM API 基础地址 (全局默认，兼容旧配置；推荐使用 providers 注册表)
api_endpoint: "https://open.bigmodel.cn/api/paas/v4"

# Provider 连接信息注册表
# 每个 agent 可通过 provider 字段引用不同的供应商
# 示例：
#   agents:
#     tagent:
#       provider: zhipu        # 智谱 GLM（OpenAI 兼容协议）
#       model: glm-5
#     knowledge:
#       provider: deepseek     # DeepSeek（OpenAI 兼容协议）
#       model: deepseek-chat
#     action:
#       provider: anthropic    # Anthropic Claude（原生协议）
#       model: claude-3-5-sonnet-20241022
providers:
  # ===== OpenAI 兼容协议的供应商 =====
  # 以下供应商都使用 OpenAI 兼容 API，provider 字段统一填 "openai"，
  # 通过不同的 api_endpoint 区分。
  zhipu:
    provider: openai           # 关键: 指明使用 OpenAI 兼容协议
    api_endpoint: "https://open.bigmodel.cn/api/paas/v4"
    api_key_env: "ZAI_API_KEY"
  deepseek:
    provider: openai
    api_endpoint: "https://api.deepseek.com/v1"
    api_key_env: "DEEPSEEK_API_KEY"
  moonshot:
    provider: openai
    api_endpoint: "https://api.moonshot.cn/v1"
    api_key_env: "MOONSHOT_API_KEY"
  tencent:
    provider: openai
    api_endpoint: "https://tokenhub.tencentmaas.com/v1"
    api_key_env: "TENCENT_API_KEY"
  # ===== 非 OpenAI 兼容协议的供应商 =====
  # 以下供应商使用各自的私有协议，provider 字段填对应的协议名称。
  # anthropic:
  #   provider: anthropic
  #   api_endpoint: "https://api.anthropic.com"
  #   api_key_env: "ANTHROPIC_API_KEY"
  # gemini:
  #   provider: gemini
  #   api_key_env: "GOOGLE_API_KEY"

# 日志级别: "debug", "info", "warn", "error"
# debug 级别会打印 LLM 上下文明文、工具调用详情、压缩细节等
# 可通过环境变量 LOG_LEVEL 覆盖
log_level: "debug"

# 请求超时（秒），默认 3600 (60 分钟)
request_timeout_seconds: 3600

# 轨迹记录 — 启用后将每次 LLM 调用记录为 JSONL 文件，可用于后续 SFT/RL 训练
trajectory_dump: true
trajectory_dir: "data/trajectories"

# ===== Agent 配置 =====

entry: tagent
prompt_dir: resources/prompts

agents:
  # ========================================================================
  # 顶层 Agent: 微信助手的主 Agent
  # ========================================================================
  tagent:
    provider: tencent            # 引用 providers 注册表中的 "tencent" 配置
    model: hy3
    system_prompt:
      files:
        - AGENTS.md
        - SOUL.md
        - USER.md
        - TOOLS.md
    memory:
      type: localfile
      path: .wechat-config/data
    max_tool_iterations: 50
    max_tokens: 128000
    temperature: 0.7
    compress_threshold: 0.8
    keep_recent_tasks: 2
    # Value-driven compression configuration
    compress:
      # summary_model: LLM model for context compression summaries.
      # Falls back to the agent's main model if not set.
      summary_model: deepseek-v4-flash-202605
      # summary_provider: optional, defaults to same provider as this agent.
      # Use a different provider for cost optimization (e.g., cheaper model for compression).
      summary_provider: tencent
      # value_floors: minimum value_score per event type (0.0-1.0).
      # The LLM valuator's output is clamped to at least the floor for each type.
      value_floors:
        external_input: 0.5
        agent_output: 0.4
      # valuation_timeout_ms: maximum wall-clock time for the entire valuation phase.
      # Default: 10000 (10s). Set to 0 to disable (not recommended).
      valuation_timeout_ms: 300000
    tools:
      # Knowledge Agent: 知识获取与翻译
      # event_keys 参数: LLM 从上下文中选择相关事件的 Snowflake EventKey 列表，
      # AgentToolWrapper 自动从父 agent 的 MemStore 还原完整事件并序列化到
      # RuntimeState["external_context"]，子 agent 通过 Run 读取。
      - agent: knowledge
        description_file: knowledge_tool_desc.md
        event_params: [event_keys]
        max_tool_iterations: 5
        max_tokens: 32000
        temperature: 0.3

      # Recall Agent: 记忆检索
      - agent: recall
        description_file: recall_tool_desc.md
        event_params: [event_keys]
        max_tool_iterations: 5
        max_tokens: 32000

      # Plan Agent: 工作计划管理
      # tagent 告诉 plan 要做什么，plan 通过 openspec 创建/更新/归档计划
      - agent: plan
        description_file: plan_tool_desc.md
        max_tool_iterations: 5
        max_tokens: 32000
        temperature: 0.3

      # File Tools: 读统一 ./，写统一 ./workspace
      - kind: tool
        id: read_file
      - kind: tool
        id: list_file
      - kind: tool
        id: search_file
      - kind: tool
        id: search_content
      - kind: tool
        id: read_multiple_files
      - kind: tool
        id: save_file
        # properties:
        #   base_dir: "./workspace"
      - kind: tool
        id: replace_content
        # properties:
        #   base_dir: "./workspace"

      # Speak Agent: 语音输出 (桩)
      - agent: speak
        description_file: speak_tool_desc.md
        max_tool_iterations: 3
        max_tokens: 1024
        temperature: 0.3

      # Draw Agent: 图像生成 (桩)
      - agent: draw
        description_file: draw_tool_desc.md
        max_tool_iterations: 3
        max_tokens: 1024
        temperature: 0.3

      # Exec Tool: shell 命令执行 (异步, 通过 tmux)
      # TmuxMonitor 配置可通过 properties.monitor 段覆盖默认值:
      #   interval: 轮询检测间隔 (默认 30s)
      #   stable_duration: 非交互命令稳定判定时间 (默认 60s)
      #   interactive_stable_duration: 交互式命令稳定判定时间 (默认 90s)
      #   fake_dead_duration: 假死判定时间 (默认 150s)
      - kind: tool
        id: exec
        description_file: exec_tool_desc.md
        properties:
          # workspace: ./workspace
          monitor:
            interval: 3s
            stable_duration: 30s
            fake_dead_duration: 180s

      # 远程 Agent 示例 (A2A 通信):
      # 当子 agent 部署在独立进程时，只需声明 remote.url。
      # tagent.go 自动创建 A2AAgent 并配置 TransferStateKey，
      # 上下文通过 RuntimeState → A2A metadata → RuntimeState 自动传递。
      #
      # - agent: remote-knowledge
      #   description_file: knowledge_tool_desc.md
      #   event_params: [event_keys]
      #   remote:
      #     url: "http://knowledge-service:8088"

    # Meditation (定时心跳): 空闲时触发上下文清理、深度分析和 skill 积累
    # 仅在 entry agent 上生效
    meditation:
      enabled: true
      interval: "30m"     # 检查间隔
      min_gap: "2h"       # 距上次事件不足此值则跳过
      prompt_file: "meditation.md"

  # ========================================================================
  # Knowledge Agent: 知识获取 & 翻译子 Agent
  # ========================================================================
  knowledge:
    provider: tencent            # 可与父 agent 使用不同供应商
    model: hy3
    system_prompt:
      files:
        - knowledge_agent.md
    memory:
      type: memory
    max_tool_iterations: 5
    max_tokens: 32000
    temperature: 0.3
    tools:
      - kind: tool
        id: skill_search
      - kind: tool
        id: skill_load
      - kind: tool
        id: mcp_discover
      - kind: tool
        id: web_search
      - kind: tool
        id: duckduckgo_search
      - kind: tool
        id: memory_query

  # ========================================================================
  # Recall Agent: 记忆检索子 Agent
  # ========================================================================
  recall:
    provider: tencent
    model: deepseek-v4-flash-202605
    system_prompt:
      files:
        - recall_agent.md
    memory:
      type: localfile
      path: .wechat-config/data
      read_namespaces:
        - tagent
    max_tool_iterations: 5
    max_tokens: 32000
    tools:
      - kind: tool
        id: recall_query
      - kind: tool
        id: recall_get
      - kind: tool
        id: recall_recent
      - kind: tool
        id: recall_trace

  # ========================================================================
  # Action Agent: 执行中枢
  # 接收 tagent 的行为指令，调度 file/speak/draw 工具或直接 exec 执行
  # ========================================================================
  action:
    provider: tencent
    model: hy3
    system_prompt:
      files:
        - action_agent.md
    memory:
      type: memory
    max_tool_iterations: 50
    max_tokens: 32000
    temperature: 0.3
    tools:
      # File Tools: 读统一 ./，写统一 ./workspace
      - kind: tool
        id: read_file
      - kind: tool
        id: list_file
      - kind: tool
        id: search_file
      - kind: tool
        id: search_content
      - kind: tool
        id: read_multiple_files
      - kind: tool
        id: save_file
        # properties:
        #   base_dir: "./workspace"
      - kind: tool
        id: replace_content
        # properties:
        #   base_dir: "./workspace"

      # Speak Agent: 语音输出 (桩)
      - agent: speak
        description_file: speak_tool_desc.md
        max_tool_iterations: 3
        max_tokens: 1024
        temperature: 0.3

      # Draw Agent: 图像生成 (桩)
      - agent: draw
        description_file: draw_tool_desc.md
        max_tool_iterations: 3
        max_tokens: 1024
        temperature: 0.3

      # Exec Tool: 直接 shell 命令执行 (简单命令)
      # TmuxMonitor 配置可通过 properties.monitor 段覆盖默认值:
      #   interval: 轮询检测间隔 (默认 30s)
      #   stable_duration: 非交互命令稳定判定时间 (默认 60s)
      #   interactive_stable_duration: 交互式命令稳定判定时间 (默认 90s)
      #   fake_dead_duration: 假死判定时间 (默认 150s)
      - kind: tool
        id: exec
        description_file: exec_tool_desc.md
        properties:
          # workspace: ./workspace
          monitor:
            interval: 3s
            stable_duration: 30s
            fake_dead_duration: 180s

  # ========================================================================
  # Plan Agent: 工作计划管理子 Agent
  # 通过 openspec CLI 创建/更新/归档结构化工作计划
  # ========================================================================
  plan:
    model: glm-5.2
    provider: zhipu
    system_prompt:
      files:
        - plan_agent.md
    memory:
      type: memory
    max_tool_iterations: 5
    max_tokens: 64000
    temperature: 0.3
    tools:
      # Exec Tool: 调用 openspec CLI
      - kind: tool
        id: exec
        properties:
          # workspace: ./workspace
          monitor:
            interval: 3s
            stable_duration: 15s
            fake_dead_duration: 60s
      # File Tools: 读统一 ./，写统一 ./workspace
      - kind: tool
        id: read_file
      - kind: tool
        id: list_file
      - kind: tool
        id: search_file
      - kind: tool
        id: search_content
      - kind: tool
        id: read_multiple_files
      - kind: tool
        id: save_file
        properties:
          # base_dir: "./workspace"
      - kind: tool
        id: replace_content
        properties:
          # base_dir: "./workspace"

  # ========================================================================
  # Speak Agent: 语音/表达子 Agent (桩, 暂未启用)
  # ========================================================================
  speak:
    provider: zhipu
    model: glm-4.7
    system_prompt:
      files:
        - speak_agent.md
    memory:
      type: memory
    max_tool_iterations: 3
    max_tokens: 1024
    temperature: 0.3

  # ========================================================================
  # Draw Agent: 图像生成子 Agent (桩, 暂未启用)
  # 待接入图像生成模型后激活
  # ========================================================================
  draw:
    provider: zhipu
    model: glm-4.7
    system_prompt:
      files:
        - draw_agent.md
    memory:
      type: memory
    max_tool_iterations: 3
    max_tokens: 1024
    temperature: 0.3

# ===== 应用专属配置 (各应用自行反序列化) =====
app:
  wechat:
    config_dir: ".wechat-config"
    token_file: "token.json"
    context_token_dir: ".wechat-context-tokens"
