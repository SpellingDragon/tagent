# ============================================================================
# tagent WeChat Bot 配置文件 (Single Source of Truth)
# ============================================================================
# 解码纪律:loadHostDocument 走 api/config 的 strict 面(DecodeStrict)。
#   **未知键拒启动**:任何 schema 未声明的键都会以「文件名:行号:字段路径: unknown field」
#   拒绝启动,而不会被静默忽略。因此本文件只出现宿主真正读取的键。
#   schema 见 host.go 的 hostDocument;写进本文件的键必须已被该结构读取,
#   未支持的键以行首「待接线」注释登记,不写进 YAML。新增键须先接 schema。
#   ⚠️ 两种工具引用:kind: tool 是宿主直接贡献的实例(send/recall_*/skill_*/spec/file 七件);
#   `- { kind: agent, agent: <id> }` 是委派——声明即授权:被引用 agent 必须在本文件
#   声明,模型只看得见名为该 id 的委派工具(工具面按被引用 agent 自己的 tools[] 建),
#   引用未声明 agent 一律拒启动。`description_file` 热载工具描述,`event_params` 列出
#   的调用参数其值随 handoff refs 交给子 agent。
#
# 分层:tagent YAML(agent 定义) · providers(连接注册表)。
# 敏感信息(API Key)一律经环境变量注入,不写此文件。
#
# 编排约定(消除冗余,语义等价):
#   · 全局 provider/model 为默认值 —— agent 省略即回退全局(见 host.go modelName),
#     仅 plan 覆盖 model、knowledge 覆盖 provider+model。改全局默认即改全体,无需逐 agent 重复。
# ============================================================================

# ===== 全局默认(agent 省略 provider/model 时回退此)=====
provider: zhipu                                           # providers 注册表键(智谱 GLM,openai 兼容协议)
model: glm-5.3-flash                                        # 主模型;plan 覆盖为 glm-5.3
request_timeout_seconds: 3600

# ===== Provider 连接注册表 =====
# provider 字段 = 协议实现(openai 兼容 / anthropic / gemini / ollama / hunyuan);国内模型多用 openai 兼容,以 api_endpoint 区分。
providers:
  zhipu:      { provider: openai, api_endpoint: "https://open.bigmodel.cn/api/coding/paas/v4", api_key_env: "ZAI_API_KEY" }
  deepseek:   { provider: openai, api_endpoint: "https://api.deepseek.com/v1",                 api_key_env: "DEEPSEEK_API_KEY" }
  moonshot:   { provider: openai, api_endpoint: "https://api.moonshot.cn/v1",                  api_key_env: "MOONSHOT_API_KEY" }
  tencent_hy: { provider: openai, api_endpoint: "https://api.lkeap.cloud.tencent.com/plan/v3", api_key_env: "TENCENT_HY_API_KEY" }
  tencent:    { provider: openai, api_endpoint: "https://tokenhub.tencentmaas.com/v1",         api_key_env: "TENCENT_API_KEY" }
  # 私有协议按需启用:
  # anthropic: { provider: anthropic, api_endpoint: "https://api.anthropic.com", api_key_env: "ANTHROPIC_API_KEY" }
  # gemini:    { provider: gemini, api_key_env: "GOOGLE_API_KEY" }

# ===== MCP 服务端注册表 =====
# 声明即绑定:核心把这里声明的 server 绑到 mcp_call / mcp_discover 读取的活注册表。
# transport 支持 streamable-http(归一化为框架的 streamable)与 sse;api_key_env
# 指向的环境变量缺失时拒启动。
mcp_servers:
  web-search-prime:
    transport: streamable-http
    url: https://open.bigmodel.cn/api/mcp/web_search_prime/mcp
    api_key_env: ZAI_API_KEY
  zread:
    transport: streamable-http
    url: https://open.bigmodel.cn/api/mcp/zread/mcp
    api_key_env: ZAI_API_KEY

# ===== 记忆面(共享持久存储 + 语义引擎)=====
# 存储不再有顶层 storage 段:它由各 agent 的 memory 段声明,宿主把全体声明归并成
# 一个 tier + 一个 engine(hostDocument.memorySettings)——同一份存储被两种引擎读会答出
# 两种结果,所以只有一处声明引擎、其余处只声明存储与读授权;声明不一致一律拒启动。
#   · type/path:localfile 的原始层与分段层根;.wechat-config/data 是旧世界的
#     KV/事件目录,指向它即接回跨重启的历史知识(legacy body 由 DecodeEventBody 兼容)。
#   · read_namespaces:跨分区读授权(recall.New 的授权面);自身命名空间恒在授权内,
#     这里列出的名字追加到它之后。不声明则不跨区。
#   · engine:语义引擎,embedding 经 trpc knowledge/embedder/openai 真调用;
#     vector_top_k/keyword_top_k 是混合检索两腿的上限,rrf_k 是融合秩常数(零值=历史行为)。
#     api_key_env 指向的变量缺失时具名拒启动(embedding key is not set)。

# ===== 治理闸(装配期恒挂 WithGovernance;此处开启审批面)=====
# 行为详情见 docs/wiki/platform/agent-behavior-matrix.md 与 platform-subsystems.md(historical-verbatim,
# 描述的是已移除的子系统;本宿主实际只消费下面四个键)。
governance:
  enabled: true
  enforcement: warn            # warn(放行) 是本宿主支持的另一档;strict 时追加 WithStrict——critical 恒需人工批准(不受此放松)
  dir: data/governance         # 审批持久化目录(空=纯内存)
  # approval_ttl_minutes: 30   # 审批有效期;缺省(0)时由 approval 包取自身默认

# ===== Agent 配置 =====
entry: tagent
prompt_dir: resources/prompts

agents:
  # ---- 顶层主 Agent(微信助手)----
  tagent:
    # provider/model 省略 → 回退全局(zhipu / glm-5.3-flash)
    # USER.md 是部署侧个人上下文,不随仓库分发(见 .gitignore 与 USER.md.example)。
    # 检出库不带它时,宿主按 skip-missing 契约跳过一个 info 日志继续装配;
    # 部署方把 USER.md 放进 prompt_dir 即被加载。
    system_prompt:
      files: [AGENTS.md, SOUL.md, USER.md]
    # 送达面:send 是冥想反思会话唯一的跨会话写面(教训推送),业务正文仍只经自动投递出口落地(D4)。
    # 委派面:knowledge/recall/plan/action 声明为 agent 引用——模型看到名为 knowledge/recall/plan/action
    # 的工具,工具面是被委派 agent 自己的 tools[](file/exec 在 action、recall 在 recall),
    # 冥想整理轮因此天然具备 file 读/exec 受限执行/recall 三种能力,零新机制。
    tools:
      - { kind: tool, id: send }
      - { kind: agent, agent: knowledge, description_file: knowledge_backend.md }
      - { kind: agent, agent: recall, event_params: [event_keys] }
      - { kind: agent, agent: plan, description_file: plan_tool_desc.md }
      - { kind: agent, agent: action, description_file: action_tool_desc.md }
    # 模型窗口:声明即注册会话投影——历史按窗口余量呈现,三龄段折叠随体积默认触发;
    # compress_threshold(缺省0.8)/keep_recent_tasks(缺省2)不写即走默认。
    max_tokens: 128000
    # 看门狗收尾轮(声明即 opt-in;不声明=无界,与未接此键时完全一致):
    # 第 24 个工具轮或跑满 3300 秒后,下一决策转为收尾轮——请求尾部追加收尾指令,
    # 该轮走 120 秒短超时,发起的工具调用一律不受理并配好回执,回答本轮已产出的东西。
    final_round:
      max_rounds: 24
      budget_seconds: 3300
      timeout_seconds: 120
    # 记忆面:本 agent 是共享 tier 的声明处(见文件头的记忆面说明),也是语义引擎的唯一声明处。
    memory:
      type: localfile
      path: .wechat-config/data
      read_namespaces: [tagent]
      engine:
        backend: memory
        embedding:
          provider: zhipu
          model: embedding-3
          api_key_env: ZAI_API_KEY
          dimensions: 512
        vector_top_k: 20
        keyword_top_k: 20
        rrf_k: 60
    # 冥想(自察缺省,r14/r14b/ADR 0005):主语=本 agent 自身,反思回合跑在专属反思会话
    # (tagent-session:tagent:reflection),经验卡片落本分区与本会话链——用户业务会话零污染,
    # 同一 agent 的全分区真实内容可读,教训由 recall 拉取、send 推送到目标活跃会话。
    # 触发是自持状态机(ADR 0003):外部事件充电,激活即一条既有 external_input 携带因果元数据;
    # 没有 ticker,interval 是两次点火之间的下限,min_gap 是两次已消费反思的最小间隔。
    # observed_namespaces 缺省=自身分区(自察);显式列他人分区即跨域策展,须落在 read 授权内。
    # 一个进程只驱动一条反思循环:第二个 enabled 的 agent 拒启动。
    meditation:
      enabled: true
      interval: 30m
      min_gap: 2h
      prompt_file: meditation.md
      deliver_to: [tagent]
    # 已接线的模型参数(不写走模型默认): temperature / thinking_enabled /
    #   reasoning_effort / max_tool_iterations(映射看门狗轮数)
    # 待接线: task_terminal_ttl / task_default_ttl

  # ---- Knowledge:知识获取 & 翻译子 Agent ----
  knowledge:
    provider: deepseek
    model: deepseek-flash
    system_prompt:
      files: [knowledge_agent.md, knowledge_backend.md]
    # 思考参数:是否思考与强度按 agent 独立声明(请求级注入,未声明走模型默认)。
    thinking_enabled: true
    reasoning_effort: high
    # 看门狗收尾轮:本 agent 自己的预算(声明即生效,不再只读 entry)。
    final_round:
      max_rounds: 5
      timeout_seconds: 120
    # 知识面:skill_dirs 是技能仓根,read_root 限定 read_file 的沙箱根。
    # 三工具复用 trpc skill/file 面(skill_search/skill_load/read_file),不自行造轮。
    skill_dirs: [skills]
    read_root: .
    # web 检索:经 MCP 网关调顶层 mcp_servers 的 web-search-prime(智谱搜索)。
    tools:
      - { kind: tool, id: skill_search }
      - { kind: tool, id: skill_load }
      - { kind: tool, id: read_file }
      - { kind: tool, id: mcp_call }
      - { kind: tool, id: mcp_discover }
    # 待接线:memory / max_tokens / compress_threshold / memory_query

  # ---- Recall:记忆检索子 Agent ----
  recall:
    system_prompt:
      files: [recall_agent.md]
    # 检索求快:关闭思考,自设收尾预算。
    thinking_enabled: false
    final_round:
      max_rounds: 5
      timeout_seconds: 120      # 本目录自带(工具名按本部署的声明书写:recall_query/recall_get/recall_recent/recall_trace)
    # 记忆读面:声明即授权(不声明的 agent 看不见该工具);四工具经 tool/recall 装配,
    # 读面由宿主注入(hostRecallSeam):Searcher 走装配后的 Run.Recall,Table 走已提交
    # 存储的观察表,Originals 走 storage 的 scoped 原始层,Embedder 由宿主绑定,而 Trace
    # 走宿主自持的 relation 账本(运行时本身不维护 relations)。不声明 storage 时读面为空,
    # 调用即具名拒绝(recall: the deployment wires no read face)。
    tools:
      - { kind: tool, id: recall_query }
      - { kind: tool, id: recall_get }
      - { kind: tool, id: recall_recent }
      - { kind: tool, id: recall_trace }
    # 记忆面:与 tagent 同一 tier(归并校验);read_namespaces 把 tagent 分区追加进读授权,
    # 于是 recall_query 能在自身分区之外检索业务分区的历史。
    memory:
      type: localfile
      path: .wechat-config/data
      read_namespaces: [tagent]
    # 待接线:max_tool_iterations / max_tokens / compress_threshold / reasoning_effort

  # ---- Action:执行中枢(调度 file/exec/mcp)----
  action:
    system_prompt:
      files: [action_agent.md]      # 本目录自带(工具名按本部署的声明书写:file 工具/exec_run·exec_release/mcp_call)
    # 文件面:base_dir 是全部相对路径的沙箱根,read_roots 追加只读根;
    # tools[] 列出的 file 工具即授权,未列出的不进入模型请求。
    file:
      base_dir: .
    # 执行面:monitor 是 tmux 监控节奏(间隔/静默判定/疑似假死),未声明的字段取框架默认。
    exec:
      monitor:
        interval: 3s
        stable_duration: 30s
        fake_dead_duration: 180s
    # 工具面:七件 file 工具与 exec/mcp 网关均由核心按声明装配;exec 声明一项即授予
    # exec_run 与 exec_release 两件,MCP 网关读顶层 mcp_servers 的活注册表。
    tools:
      - { kind: tool, id: read_file }
      - { kind: tool, id: list_file }
      - { kind: tool, id: search_file }
      - { kind: tool, id: search_content }
      - { kind: tool, id: read_multiple_files }
      - { kind: tool, id: save_file }
      - { kind: tool, id: replace_content }
      - { kind: tool, id: exec }
      - { kind: tool, id: mcp_call }
      - { kind: tool, id: mcp_discover }
    # 待接线:memory / max_tool_iterations / max_tokens / compress_threshold /
    #         temperature / thinking_enabled / reasoning_effort

  # ---- Plan:工作计划管理子 Agent(计划后端 CLI,无通用 shell 逃逸面)----
  plan:
    provider: zhipu                      # 显式覆盖:全局 provider 可被改动,wiring 空 provider 时按全局回退→模型会被发给错误端点→400,故 plan 恒显式声明
    model: glm-5.3                       # 覆盖全局 flash(plan 需更强推理)
    system_prompt:
      files: [plan_agent.md]
    # 文件面:写根＝计划后端交出的工作区根(核心语义,配置不命名实现目录);此处只声明
    # 读根:"."＝部署根,绝对路径可读;相对路径仍落在工作区内,写不出工作区。
    file:
      read_roots: ["."]
    tools:
      # spec 工具:闭集操作(init/new/status/validate/archive/instructions/list),
      # 后端为计划后端 CLI(argv 直调,无 shell);计划文件本身经 file 面读写。
      - { kind: tool, id: spec }
      - { kind: tool, id: save_file }
      - { kind: tool, id: read_file }
      - { kind: tool, id: read_multiple_files }
      - { kind: tool, id: list_file }
      - { kind: tool, id: search_file }
      - { kind: tool, id: search_content }
      - { kind: tool, id: replace_content }
    # 待接线:thinking_enabled / max_tool_iterations / max_tokens / compress_threshold / temperature

  # ---- Meditator:可选跨域策展声明(默认退役;缺省冥想=tagent 自察)----
  # r14b/ADR 0005:缺省自察挂宿主自身。独立策展 agent 降格为显式跨域选项——它读别人的
  # 分区(摘要+回查),与宿主自察同一机制、不同观察面与反思会话。启用方式:把下面整块
  # 注释解开、把 tagent 的 meditation 节注释掉(一个进程至多一条 enabled 反思循环),
  # 并在 meditator 上恢复 meditation 节(observed_namespaces 显式列目标分区)。
  # meditator:
  #   system_prompt:
  #     files: [meditator_agent.md]
  #   max_tokens: 32000
  #   # 整理面:file 读/写、exec 受限执行、recall 检索、send 跨会话投递;工具白名单不变。
  #   file:
  #     base_dir: .
  #   exec:
  #     monitor:
  #       interval: 3s
  #       stable_duration: 30s
  #       fake_dead_duration: 180s
  #   tools:
  #     - { kind: tool, id: send }
  #     - { kind: tool, id: read_file }
  #     - { kind: tool, id: list_file }
  #     - { kind: tool, id: search_file }
  #     - { kind: tool, id: search_content }
  #     - { kind: tool, id: read_multiple_files }
  #     - { kind: tool, id: save_file }
  #     - { kind: tool, id: replace_content }
  #     - { kind: tool, id: exec }
  #     - { kind: tool, id: recall_query }
  #     - { kind: tool, id: recall_get }
  #     - { kind: tool, id: recall_recent }
  #     - { kind: tool, id: recall_trace }
  #   memory:
  #     type: localfile
  #     path: .wechat-config/data
  #     read_namespaces: [tagent]
  #   # meditation:
  #   #   enabled: true
  #   #   interval: 30m
  #   #   min_gap: 2h
  #   #   prompt_file: meditation.md
  #   #   observed_namespaces: [tagent]   # 跨域策展:显式列目标分区,缺失=自身分区
  #   #   deliver_to: [tagent]

# ===== 应用专属配置(各应用自行反序列化)=====
app:
  wechat:
    config_dir: ".wechat-config"
    token_file: "token.json"
    context_token_dir: ".wechat-context-tokens"
    workspace_dir: ".tagent-workspace"   # 入站附件/长文本落盘(容器内 TAGENT_WECHAT_WORKSPACE_DIR 覆盖)
    # ops_session: "wxid_owner"          # 启动通知(转世通报/系统告警)的固定目标会话;空=宿主运维会址 <session-prefix>ops
    # approvers: ["wxid_owner"]          # critical 操作的消息批准白名单;空=消息批准关闭,只经 CLI 批准
