# ============================================================================
# tagent WeChat Bot 配置文件 (Single Source of Truth)
# ============================================================================
#
# 所有配置统一在此文件中管理，无需维护多份配置文件。
#
# 配置分层说明:
#   - tagent YAML: agent 定义（模型、供应商、超参、prompt、event_params）
#   - providers: 供应商连接信息注册表（endpoint, api_key_env）
#   - ToolRef.Remote: 连接信息（remote.url = "这个 agent 在哪里"）
#   - trpc Go options: 通信细节（A2A 协议、TransferStateKey）— tagent.go 内部自动生成
#
# 多供应商支持:
#   每个 agent 可通过 provider 字段引用不同的模型供应商（openai/anthropic/gemini/ollama/hunyuan）
#   示例: knowledge agent 使用 Anthropic Claude，其他 agent 使用智谱 GLM
#
# 敏感信息:
#   API Key 通过环境变量设置，不要写在此文件中
# ============================================================================

# ===== 运行时配置 =====

# 全局默认 provider (不填则默认 "openai")
# 支持 5 种 provider 实现:
#   openai    — OpenAI 兼容协议（OpenAI / 智谱 GLM / DeepSeek / Moonshot / Baichuan / 通义千问等）
#   anthropic — Anthropic Claude 原生协议
#   gemini    — Google Gemini 原生协议
#   ollama    — Ollama 本地模型
#   hunyuan   — 腾讯混元原生协议
# 注意: 大多数国内模型（GLM、DeepSeek、Kimi 等）都使用 OpenAI 兼容 API，
#       因此 provider 应填 "openai"，通过 api_endpoint 区分具体供应商。
provider: openai

# LLM 模型 (所有 agent 的默认模型，各 agent 可单独覆盖)
model: glm-5
# LLM API 基础地址 (全局默认，兼容旧配置；推荐使用 providers 注册表)
api_endpoint: "https://open.bigmodel.cn/api/paas/v4"

# Provider 连接信息注册表
# 每个 agent 可通过 provider 字段引用不同的供应商
# 示例：
#   agents:
#     tagent:
#       provider: zhipu        # 智谱 GLM（OpenAI 兼容协议）
#       model: glm-5
#     knowledge:
#       provider: deepseek     # DeepSeek（OpenAI 兼容协议）
#       model: deepseek-chat
#     action:
#       provider: anthropic    # Anthropic Claude（原生协议）
#       model: claude-3-5-sonnet-20241022
providers:
  # ===== OpenAI 兼容协议的供应商 =====
  # 以下供应商都使用 OpenAI 兼容 API，provider 字段统一填 "openai"，
  # 通过不同的 api_endpoint 区分。
  zhipu:
    provider: openai           # 关键: 指明使用 OpenAI 兼容协议
    api_endpoint: "https://open.bigmodel.cn/api/paas/v4"
    api_key_env: "ZAI_API_KEY"
  deepseek:
    provider: openai
    api_endpoint: "https://api.deepseek.com/v1"
    api_key_env: "DEEPSEEK_API_KEY"
  moonshot:
    provider: openai
    api_endpoint: "https://api.moonshot.cn/v1"
    api_key_env: "MOONSHOT_API_KEY"
  tencent_hy:
    provider: openai
    api_endpoint: "https://api.lkeap.cloud.tencent.com/plan/v3"
    api_key_env: "TENCENT_HY_API_KEY"
  tencent:
    provider: openai
    api_endpoint: "https://tokenhub.tencentmaas.com/v1"
    api_key_env: "TENCENT_API_KEY"
  # ===== 非 OpenAI 兼容协议的供应商 =====
  # 以下供应商使用各自的私有协议，provider 字段填对应的协议名称。
  # anthropic:
  #   provider: anthropic
  #   api_endpoint: "https://api.anthropic.com"
  #   api_key_env: "ANTHROPIC_API_KEY"
  # gemini:
  #   provider: gemini
  #   api_key_env: "GOOGLE_API_KEY"

# 日志级别: "debug", "info", "warn", "error"
# debug 级别会打印 LLM 上下文明文、工具调用详情、压缩细节等
# 可通过环境变量 LOG_LEVEL 覆盖
log_level: "debug"

# 请求超时（秒），默认 3600 (60 分钟)
request_timeout_seconds: 3600

# 轨迹记录 — 启用后将每次 LLM 调用记录为 JSONL 文件，可用于后续 SFT/RL 训练
trajectory_dump: true
trajectory_dir: "data/trajectories"

# ===== Agent 配置 =====
#
# Thinking/Reasoning 模式控制 (每个 agent 可独立配置):
#   thinking_enabled: true/false    — 开启 thinking 模式 (GLM/Claude/Gemini/DeepSeek honor 此字段；hy3 忽略)
#   thinking_tokens: 4096           — thinking token 预算 (Claude/Gemini 需要；hy3 忽略)
#   reasoning_effort: "high"        — 推理强度 (low/medium/high)；OpenAI o-series 与 hy3/hunyuan 的思考开关
#   reasoning_content_mode: "discard_previous" — 历史推理内容处理策略:
#     keep_all           — 保留所有 reasoning_content
#     discard_previous   — 丢弃历史轮次 (默认, 推荐 DeepSeek)
#     discard_all        — 丢弃所有

entry: tagent
prompt_dir: resources/prompts

agents:
  # ========================================================================
  # 顶层 Agent: 微信助手的主 Agent
  # ========================================================================
  tagent:
    provider: tencent_hy            # 引用 providers 注册表中的 "tencent_hy" 配置
    model: hy3
    system_prompt:
      files:
        - AGENTS.md
        - SOUL.md
        - USER.md
        - TOOLS.md
    memory:
      type: localfile
      path: .wechat-config/data
    max_tool_iterations: 300
    max_tokens: 128000
    temperature: 0.7
    thinking_enabled: true       # 保留：对 honor thinking_enabled 的模型有效
    reasoning_effort: "high"     # hy3 真正的思考触发器（hy3 忽略 thinking_enabled）
    compress_threshold: 0.8
    keep_recent_tasks: 2
    # ===== 异步任务/重入相关（均可选，未配置时用默认值） =====
    # task_terminal_ttl: 终态任务（completed/failed/cancelled/dead）被回收前的
    #   保留期（duration 字符串，默认 "2m"）。它同时是终态 subagent 任务的
    #   resume_task 重入窗口：超过此时长后任务被 prune，只能发起全新调用。
    #   需要更长续行窗口（如 plan 任务隔很久追加指令）可调大。
    # task_terminal_ttl: "30m"
    # resume_context_rounds: 重入时任务链还原器注入的前序轮次数（默认 3）
    # resume_context_rounds: 3
    # task_settled_max_inline: task_settled 通知内联结果上限（默认 2000，
    #   全量结果始终可经 get_task_result 查询）
    # task_settled_max_inline: 2000
    # Compression configuration
    compress:
      # summary_model: LLM model for context compression summaries.
      # Falls back to the agent's main model if not set.
      summary_model: deepseek-v4-flash-202605
      # summary_provider: optional, defaults to same provider as this agent.
      # Use a different provider for cost optimization (e.g., cheaper model for compression).
      summary_provider: tencent
      # summary_max_tokens: 每次摘要 LLM 调用的输出 token 预算下限（默认 8192）。
      # 推理模型会把部分 max_tokens 耗在思考链上，预算不足会返回空 Content 导致
      # 压缩全段降级（上下文塌缩成纯 user 消息）。实际预算随摘要大小上浮，但不低于此值。
      summary_max_tokens: 8192
      # card_max_chars: 滚动压缩摘要中卡片序列的长度上限（默认 6000）。
      # 超限时旧卡片由 summary_model 整理为浓缩卡片；无模型则最旧行沉底为计数。
      # card_max_chars: 6000
      # archive_cache_cap: 归档缓存条数上限（默认 256,固化物本体永在 MemoryStore）
      # archive_cache_cap: 256
    tools:
      # Knowledge Agent: 知识获取与翻译
      # event_keys 参数: LLM 从上下文中选择相关事件的 Snowflake EventKey 列表，
      # AgentToolWrapper 自动从父 agent 的 MemStore 还原完整事件并序列化到
      # RuntimeState["external_context"]，子 agent 通过 Run 读取。
      # 子 agent 的运行参数（max_tool_iterations/max_tokens/temperature）在其自身
      # 的 agents.<name> 定义处配置；ToolRef 只声明引用关系。
      - agent: knowledge
        description_file: knowledge_tool_desc.md
        event_params: [event_keys]

      # Recall Agent: 记忆检索（复杂检索/多跳编排）
      - agent: recall
        description_file: recall_tool_desc.md
        event_params: [event_keys]

      # Memory Recall: 统一召回协议（纯函数,票据在手直达;无需经子 agent）
      - kind: tool
        id: memory_recall

      # Plan Agent: 工作计划管理
      # tagent 告诉 plan 要做什么，plan 通过 openspec 创建/更新/归档计划
      - agent: plan
        description_file: plan_tool_desc.md

      # File Tools: 相对路径基准 = 进程运行目录（与 exec 的 cwd 一致，
      # 模型看到单一文件系统视图）
      - kind: tool
        id: read_file
      - kind: tool
        id: list_file
      - kind: tool
        id: search_file
      - kind: tool
        id: search_content
      - kind: tool
        id: read_multiple_files
      - kind: tool
        id: save_file
      - kind: tool
        id: replace_content

      # Speak Agent: 语音输出 (桩)
      - agent: speak
        description_file: speak_tool_desc.md

      # Draw Agent: 图像生成 (桩)
      - agent: draw
        description_file: draw_tool_desc.md

      # Exec Tool: shell 命令执行 (异步, 通过 tmux)
      # cwd 默认 = 进程运行目录（与 file tools 一致），可用 properties.workspace 覆盖
      # TmuxMonitor 配置可通过 properties.monitor 段覆盖默认值:
      #   interval: 轮询检测间隔 (默认 30s)
      #   stable_duration: 非交互命令稳定判定时间 (默认 60s)
      #   interactive_stable_duration: 交互式命令稳定判定时间 (默认 90s)
      #   fake_dead_duration: 假死判定时间 (默认 150s)
      - kind: tool
        id: exec
        description_file: exec_tool_desc.md
        properties:
          monitor:
            interval: 3s
            stable_duration: 30s
            fake_dead_duration: 180s

      # 远程 Agent 示例 (A2A 通信):
      # 当子 agent 部署在独立进程时，只需声明 remote.url。
      # tagent.go 自动创建 A2AAgent 并配置 TransferStateKey，
      # 上下文通过 RuntimeState → A2A metadata → RuntimeState 自动传递。
      #
      # - agent: remote-knowledge
      #   description_file: knowledge_tool_desc.md
      #   event_params: [event_keys]
      #   remote:
      #     url: "http://knowledge-service:8088"

    # Meditation (定时心跳): 空闲时触发上下文清理、深度分析和 skill 积累
    # 仅在 entry agent 上生效
    meditation:
      enabled: true
      interval: "30m"     # 检查间隔
      min_gap: "2h"       # 距上次事件不足此值则跳过
      prompt_file: "meditation.md"

  # ========================================================================
  # Knowledge Agent: 知识获取 & 翻译子 Agent
  # ========================================================================
  knowledge:
    provider: tencent_hy            # 可与父 agent 使用不同供应商
    model: hy3
    system_prompt:
      files:
        - knowledge_agent.md
    memory:
      type: memory
    max_tool_iterations: 30
    max_tokens: 32000
    temperature: 0.3
    thinking_enabled: true
    reasoning_effort: "high"     # hy3 思考触发器（thinking_enabled 对 hy3 无效）
    tools:
      - kind: tool
        id: skill_search
      - kind: tool
        id: skill_load
      - kind: tool
        id: mcp_discover
      - kind: tool
        id: web_search
      - kind: tool
        id: duckduckgo_search
      - kind: tool
        id: memory_query

  # ========================================================================
  # Recall Agent: 记忆检索子 Agent
  # ========================================================================
  recall:
    provider: tencent
    model: deepseek-v4-flash-202605
    system_prompt:
      files:
        - recall_agent.md
    memory:
      type: localfile
      path: .wechat-config/data
      read_namespaces:
        - tagent
    max_tool_iterations: 5
    max_tokens: 32000
    tools:
      - kind: tool
        id: recall_query
      - kind: tool
        id: recall_get
      - kind: tool
        id: recall_recent
      - kind: tool
        id: recall_trace

  # ========================================================================
  # Action Agent: 执行中枢
  # 接收 tagent 的行为指令，调度 file/speak/draw 工具或直接 exec 执行
  # ========================================================================
  action:
    provider: tencent_hy
    model: hy3
    system_prompt:
      files:
        - action_agent.md
    memory:
      type: memory
    max_tool_iterations: 50
    max_tokens: 32000
    temperature: 0.3
    thinking_enabled: true
    reasoning_effort: "high"     # hy3 思考触发器（thinking_enabled 对 hy3 无效）
    tools:
      # File Tools: 相对路径基准 = 进程运行目录（与 exec 的 cwd 一致）
      - kind: tool
        id: read_file
      - kind: tool
        id: list_file
      - kind: tool
        id: search_file
      - kind: tool
        id: search_content
      - kind: tool
        id: read_multiple_files
      - kind: tool
        id: save_file
      - kind: tool
        id: replace_content

      # Speak Agent: 语音输出 (桩)
      - agent: speak
        description_file: speak_tool_desc.md

      # Draw Agent: 图像生成 (桩)
      - agent: draw
        description_file: draw_tool_desc.md

      # Exec Tool: 直接 shell 命令执行 (简单命令)；cwd 默认 = 进程运行目录
      # TmuxMonitor 配置可通过 properties.monitor 段覆盖默认值:
      #   interval: 轮询检测间隔 (默认 30s)
      #   stable_duration: 非交互命令稳定判定时间 (默认 60s)
      #   interactive_stable_duration: 交互式命令稳定判定时间 (默认 90s)
      #   fake_dead_duration: 假死判定时间 (默认 150s)
      - kind: tool
        id: exec
        description_file: exec_tool_desc.md
        properties:
          monitor:
            interval: 3s
            stable_duration: 30s
            fake_dead_duration: 180s

  # ========================================================================
  # Plan Agent: 工作计划管理子 Agent
  # 通过 openspec CLI 创建/更新/归档结构化工作计划
  # ========================================================================
  plan:
    model: glm-5.2
    provider: zhipu
    thinking_enabled: true
    system_prompt:
      files:
        - plan_agent.md
    memory:
      type: memory
    max_tool_iterations: 50
    max_tokens: 64000
    temperature: 0.3
    tools:
      # Spec Tool: 规格化计划管理（类型化操作，无 shell 逃逸面）。后端为
      # openspec CLI，经 exec.Command 直调 argv——plan 不持有任何通用命令执行
      # 能力，"仅限 openspec 命令"是结构性事实而非 prompt 软约束。
      - kind: tool
        id: spec
        properties:
          bin: openspec
          # work_dir 缺省 = 进程运行目录（含 openspec/ 的目录）
      # File Tools: 读全工程（做计划需看代码/文档）；写类工具沙箱锁定 openspec/
      - kind: tool
        id: read_file
      - kind: tool
        id: list_file
      - kind: tool
        id: search_file
      - kind: tool
        id: search_content
      - kind: tool
        id: read_multiple_files
      # 写类工具硬约束: base_dir 沙箱锁定 openspec/（上游 ToolSet 拒绝 ../ 与
      # 绝对路径逃逸）——plan 只能变更 openspec/ 内文件,路径相对 openspec/ 根
      # (如 changes/<name>/tasks.md,不再带 openspec/ 前缀)
      - kind: tool
        id: save_file
        properties:
          base_dir: openspec
      - kind: tool
        id: replace_content
        properties:
          base_dir: openspec

  # ========================================================================
  # Speak Agent: 语音/表达子 Agent (桩, 暂未启用)
  # ========================================================================
  speak:
    provider: zhipu
    model: glm-4.7
    system_prompt:
      files:
        - speak_agent.md
    memory:
      type: memory
    max_tool_iterations: 3
    max_tokens: 1024
    temperature: 0.3

  # ========================================================================
  # Draw Agent: 图像生成子 Agent (桩, 暂未启用)
  # 待接入图像生成模型后激活
  # ========================================================================
  draw:
    provider: zhipu
    model: glm-4.7
    system_prompt:
      files:
        - draw_agent.md
    memory:
      type: memory
    max_tool_iterations: 3
    max_tokens: 1024
    temperature: 0.3

# ===== 应用专属配置 (各应用自行反序列化) =====
app:
  wechat:
    config_dir: ".wechat-config"
    token_file: "token.json"
    context_token_dir: ".wechat-context-tokens"
