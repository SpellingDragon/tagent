# ============================================================================
# tagent WeChat Bot 配置文件 (Single Source of Truth)
# ============================================================================
# 解码纪律:loadHostDocument 走 api/config 的 strict 面(DecodeStrict)。
#   **未知键拒启动**:任何 schema 未声明的键都会以「文件名:行号:字段路径: unknown field」
#   拒绝启动,而不会被静默忽略。因此本文件只出现宿主真正读取的键。
#   schema 见 host_runtime.go 的 hostDocument;未接线的原声明就地归档为注释,
#   完整清单(键路径 + 接线所需)见 README「待接线清单」。新增键须先接 schema。
#   ⚠️ 两种工具引用:kind: tool 是宿主直接贡献的实例(send/recall_*/skill_*);
#   `- { kind: agent, agent: <id> }` 是委派——声明即授权:被引用 agent 必须在本文件
#   声明,模型只看得见名为该 id 的委派工具(工具面按被引用 agent 自己的 tools[] 建),
#   引用未声明 agent 一律拒启动。`description_file` 热载工具描述,`event_params` 列出
#   的调用参数其值随 handoff refs 交给子 agent。
#
# 分层:tagent YAML(agent 定义) · providers(连接注册表)。
# 敏感信息(API Key)一律经环境变量注入,不写此文件。
#
# 编排约定(消除冗余,语义等价):
#   · 全局 provider/model 为默认值 —— agent 省略即回退全局(见 host_runtime.go modelName),
#     仅 plan 覆盖 model、knowledge 覆盖 provider+model。改全局默认即改全体,无需逐 agent 重复。
# ============================================================================

# ===== 全局默认(agent 省略 provider/model 时回退此)=====
provider: zhipu                                           # providers 注册表键(智谱 GLM,openai 兼容协议)
model: glm-5.3-flash                                        # 主模型;plan 覆盖为 glm-5.3
request_timeout_seconds: 3600

# ===== Provider 连接注册表 =====
# provider 字段 = 协议实现(openai 兼容 / anthropic / gemini / ollama / hunyuan);国内模型多用 openai 兼容,以 api_endpoint 区分。
providers:
  zhipu:      { provider: openai, api_endpoint: "https://open.bigmodel.cn/api/coding/paas/v4", api_key_env: "ZAI_API_KEY" }
  deepseek:   { provider: openai, api_endpoint: "https://api.deepseek.com/v1",                 api_key_env: "DEEPSEEK_API_KEY" }
  moonshot:   { provider: openai, api_endpoint: "https://api.moonshot.cn/v1",                  api_key_env: "MOONSHOT_API_KEY" }
  tencent_hy: { provider: openai, api_endpoint: "https://api.lkeap.cloud.tencent.com/plan/v3", api_key_env: "TENCENT_HY_API_KEY" }
  tencent:    { provider: openai, api_endpoint: "https://tokenhub.tencentmaas.com/v1",         api_key_env: "TENCENT_API_KEY" }
  # 私有协议按需启用:
  # anthropic: { provider: anthropic, api_endpoint: "https://api.anthropic.com", api_key_env: "ANTHROPIC_API_KEY" }
  # gemini:    { provider: gemini, api_key_env: "GOOGLE_API_KEY" }

# ===== 记忆面(共享持久存储 + 语义引擎)=====
# 存储不再有顶层 storage 段:它由各 agent 的 memory 段声明,宿主把全体声明归并成
# 一个 tier + 一个 engine(hostDocument.memorySettings)——同一份存储被两种引擎读会答出
# 两种结果,所以只有一处声明引擎、其余处只声明存储与读授权;声明不一致一律拒启动。
#   · type/path:localfile 的原始层与分段层根;.wechat-config/data 是旧世界的
#     KV/事件目录,指向它即接回跨重启的历史知识(legacy body 由 DecodeEventBody 兼容)。
#   · read_namespaces:跨分区读授权(recall.New 的授权面);自身命名空间恒在授权内,
#     这里列出的名字追加到它之后。不声明则不跨区。
#   · engine:语义引擎,embedding 经 trpc knowledge/embedder/openai 真调用;
#     vector_top_k/keyword_top_k 是混合检索两腿的上限,rrf_k 是融合秩常数(零值=历史行为)。
#     api_key_env 指向的变量缺失时具名拒启动(embedding key is not set)。

# ===== 治理闸(装配期恒挂 WithGovernance;此处开启审批面)=====
# 行为详情见 docs/wiki/platform/agent-behavior-matrix.md 与 platform-subsystems.md(historical-verbatim,
# 描述的是已移除的子系统;本宿主实际只消费下面四个键)。
governance:
  enabled: true
  enforcement: warn            # warn(放行) 是本宿主支持的另一档;strict 时追加 WithStrict——critical 恒需人工批准(不受此放松)
  dir: data/governance         # 审批持久化目录(空=纯内存)
  # approval_ttl_minutes: 30   # 审批有效期;缺省(0)时由 approval 包取自身默认

# ===== Agent 配置 =====
entry: tagent
prompt_dir: resources/prompts

agents:
  # ---- 顶层主 Agent(微信助手)----
  tagent:
    # provider/model 省略 → 回退全局(zhipu / glm-5.3-flash)
    # USER.md 是部署侧个人上下文,不随仓库分发(见 .gitignore 与 USER.md.example)。
    # 检出库不带它时,宿主按 skip-missing 契约跳过一个 info 日志继续装配;
    # 部署方把 USER.md 放进 prompt_dir 即被加载。
    system_prompt:
      files: [AGENTS.md, SOUL.md, USER.md, TOOLS.md]
    # 主动送达面:声明即授权(不声明的 agent 看不见 send);发送通路与会话解析复用宿主唯一实现。
    # 委派面:knowledge/recall 声明为 agent 引用——模型看到名为 knowledge/recall 的工具,
    # 工具面是被委派 agent 自己的 tools[],描述从 description_file 热载。
    tools:
      - { kind: tool, id: send }
      - { kind: agent, agent: knowledge, description_file: knowledge_backend.md }
      - { kind: agent, agent: recall, event_params: [event_keys] }
    # 看门狗收尾轮(声明即 opt-in;不声明=无界,与未接此键时完全一致):
    # 第 24 个工具轮或跑满 3300 秒后,下一决策转为收尾轮——请求尾部追加收尾指令,
    # 该轮走 120 秒短超时,发起的工具调用一律不受理并配好回执,回答本轮已产出的东西。
    final_round:
      max_rounds: 24
      budget_seconds: 3300
      timeout_seconds: 120
    # 记忆面:本 agent 是共享 tier 的声明处(见文件头的记忆面说明),也是语义引擎的唯一声明处。
    memory:
      type: localfile
      path: .wechat-config/data
      read_namespaces: [tagent]
      engine:
        backend: memory
        embedding:
          provider: zhipu
          model: embedding-3
          api_key_env: ZAI_API_KEY
          dimensions: 512
        vector_top_k: 20
        keyword_top_k: 20
        rrf_k: 60
    # 待接线(本宿主不读,启用前须先在 host_runtime.go 接 schema 与装配):
    #   compress / max_tokens / temperature / thinking_enabled
    #   compress_threshold / keep_recent_tasks / task_terminal_ttl / task_default_ttl

  # ---- Knowledge:知识获取 & 翻译子 Agent ----
  knowledge:
    provider: deepseek
    model: deepseek-flash
    system_prompt:
      files: [knowledge_agent.md, knowledge_backend.md]
    # 知识面:skill_dirs 是技能仓根,read_root 限定 read_file 的沙箱根。
    # 三工具复用 trpc skill/file 面(skill_search/skill_load/read_file),不自行造轮。
    skill_dirs: [skills]
    read_root: .
    tools:
      - { kind: tool, id: skill_search }
      - { kind: tool, id: skill_load }
      - { kind: tool, id: read_file }
    # 待接线:memory / reasoning_effort / max_tool_iterations / max_tokens / compress_threshold
    #         以及 mcp_*/duckduckgo_search/memory_query

  # ---- Recall:记忆检索子 Agent ----
  recall:
    system_prompt:
      files: [recall_agent.md]      # 本目录自带(工具名按本部署的声明书写:recall_query/recall_get/recall_recent/recall_trace)
    # 记忆读面:声明即授权(不声明的 agent 看不见该工具);四工具经 tool/recall 装配,
    # 读面由宿主注入(hostRecallSeam):Searcher 走装配后的 Run.Recall,Table 走已提交
    # 存储的观察表,Originals 走 storage 的 scoped 原始层,Embedder 由宿主绑定,而 Trace
    # 走宿主自持的 relation 账本(运行时本身不维护 relations)。不声明 storage 时读面为空,
    # 调用即具名拒绝(recall: the deployment wires no read face)。
    tools:
      - { kind: tool, id: recall_query }
      - { kind: tool, id: recall_get }
      - { kind: tool, id: recall_recent }
      - { kind: tool, id: recall_trace }
    # 记忆面:与 tagent 同一 tier(归并校验);read_namespaces 把 tagent 分区追加进读授权,
    # 于是 recall_query 能在自身分区之外检索业务分区的历史。
    memory:
      type: localfile
      path: .wechat-config/data
      read_namespaces: [tagent]
    # 待接线:max_tool_iterations / max_tokens / compress_threshold / reasoning_effort

  # ---- Action:执行中枢(调度 file/exec/mcp)----
  action:
    system_prompt:
      files: [action_agent.md]      # 本目录自带(工具名按本部署的声明书写:file 工具/exec/mcp_call;工具面本身仍待接线)
    # 待接线:memory / max_tool_iterations / max_tokens / compress_threshold / temperature /
    #         thinking_enabled / reasoning_effort,以及 file 工具、exec、mcp_call

  # ---- Plan:工作计划管理子 Agent(openspec CLI,无通用 shell 逃逸面)----
  plan:
    provider: zhipu                      # 显式覆盖:全局 provider 可被改动,wiring 空 provider 时按全局回退→模型会被发给错误端点→400,故 plan 恒显式声明
    model: glm-5.3                       # 覆盖全局 flash(plan 需更强推理)
    system_prompt:
      files: [plan_agent.md]
    # 待接线:thinking_enabled / max_tool_iterations / max_tokens / compress_threshold / temperature,
    #         以及 spec 工具与读/写 file 工具(base_dir 沙箱锁 openspec/)

  # ---- Meditator:旁路冥想线(独立反思主体,常驻第二条循环)----
  meditator:
    system_prompt:
      files: [meditator_agent.md]
    # 主动送达面:反思结论里用户该知道的部分,经 send 显式投递(不配则模型不可见)。
    tools:
      - { kind: tool, id: send }
    # 观察面:与 tagent 同一 tier;read_namespaces 授权它读业务分区,
    # meditation.observed_namespaces 再从中圈定真正反思的分区(越界拒启动)。
    memory:
      type: localfile
      path: .wechat-config/data
      read_namespaces: [tagent]
    # 定时策展:enabled 即启动宿主 ticker(默认 30m),min_gap 是两次已消费反思的最小间隔;
    # prompt_file 是每次注入随摘要携带的静态提示(相对 prompt_dir);
    # observed_namespaces 必须落在各自 read 授权内;deliver_to 是回流白名单——
    # 本轮反思回合的 assistant 正文经宿主唯一发送通路投给这些 agent 已绑定的会话。
    # 一个进程只驱动一条反思循环:第二个 enabled 的 agent 拒启动。
    meditation:
      enabled: true
      interval: 30m
      min_gap: 2h
      prompt_file: meditation.md
      observed_namespaces: [tagent]
      deliver_to: [tagent]
    # 待接线:max_tool_iterations / max_tokens / temperature / compress_threshold,
    #         以及 recall + file 工具 + exec

# ===== 应用专属配置(各应用自行反序列化)=====
app:
  wechat:
    config_dir: ".wechat-config"
    token_file: "token.json"
    context_token_dir: ".wechat-context-tokens"
    workspace_dir: ".tagent-workspace"   # 入站附件/长文本落盘(容器内 TAGENT_WECHAT_WORKSPACE_DIR 覆盖)
    # approvers: ["wxid_owner"]          # critical 操作的消息批准白名单;空=消息批准关闭,只经 CLI 批准
