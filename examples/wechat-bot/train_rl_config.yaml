# ============================================================================
# AReaL × tagent RL 训练配置
# ============================================================================
#
# 此配置用于 AReaL PPO 训练，workflow 指向 tagent adapter。
# tagent 作为 rollout agent，通过 HTTP API 接收任务，LLM 请求经过 AReaL proxy。
#
# 启动方式:
#   cd examples/wechat-bot
#   ./run.sh train-rl                    # 前台启动
#   ./run.sh train-rl-start              # 后台启动
#
# 环境变量:
#   TAGENT_URL          tagent HTTPAPI 地址 (默认: http://localhost:8089)
#   TAGENT_USER_ID      tagent session 用户 ID (默认: rl-user)
#   TAGENT_SESSION_ID   tagent session ID (默认: rl-session)
# ============================================================================

experiment_name: tagent-grpo
trial_name: trial0

seed: 1
enable_offload: false
total_train_epochs: 10
tokenizer_path: ${actor.path}

# tagent adapter 作为 rollout workflow
# AReaL 会自动检测这不是 RolloutWorkflow，包装为 OpenAIProxyWorkflow
workflow: train.rl.tagent_adapter.TagentARealAdapter
eval_workflow: ${workflow}

# tagent adapter 参数（作为 workflow_kwargs 传递给 __init__）
tagent_url: "http://localhost:8089"
tagent_user_id: "rl-user"
tagent_session_id: "rl-session"
tagent_wait_time: 60.0

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: /tmp/train_rl/experiments
  name_resolve:
    type: nfs
    nfs_record_root: /tmp/train_rl/name_resolve

scheduler:
  type: null

rollout:
  backend: "sglang:d4p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  max_concurrent_rollouts: 32
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 2
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  dump_to_file: true
  openai:
    # inline 模式：AReaL 在进程内启动 OpenAI 兼容 proxy
    # tagent 的 LLM 请求经过此 proxy，proxy 捕获 logprobs + completion_ids
    mode: inline
    tool_call_parser: qwen25
    reasoning_parser: qwen3
    export_style: individual
    turn_discount: 1.0

gconfig:
  n_samples: 4
  min_new_tokens: 0
  max_new_tokens: 1024
  max_tokens: 2048
  greedy: false
  temperature: 1.0

actor:
  backend: "fsdp:d4p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen2.5-1.5B-Instruct
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 10240
  optimizer:
    type: adam
    lr: 1.70e-5
    weight_decay: 0.017
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.4
  temperature: ${gconfig.temperature}
  reward_scaling: 10.0
  reward_bias: -0.5
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  behave_imp_weight_cap: 5.0
  reward_norm: null
  adv_norm:
    mean_level: batch
    std_level: batch
  weight_update_mode: xccl
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cmd: python3 -m train.rl.infra.rpc.rpc_server
      env_vars:
        NCCL_DEBUG: "WARN"

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 10240
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

# SGLang inference engine
sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 32768
  mem_fraction_static: 0.8

# datasets — 替换为你的训练数据集
train_dataset:
  batch_size: 32
  shuffle: true
  pin_memory: true
  num_workers: 4
  path: openai/gsm8k
  type: rl
  max_length: 1024

valid_dataset:
  batch_size: 32
  pin_memory: true
  num_workers: 4
  path: openai/gsm8k
  type: rl

# Utilities
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
