# ============================================================================
# tagent WeChat Bot · RL rollout 参数基线
# ============================================================================
# 状态:RL 训练环路在本仓无实现——rl/ 包只保留 capture / export / reward,模型热换
#   (SwappableModel)与 HTTP /task 面不在任何装配里,宿主 main.go 亦无 RL 分支,
#   故 ./run.sh rl 入口已退役。本文件保留为**可装载的参数基线**:
#   TAGENT_CONFIG=tagent.rl.yaml ./run.sh 可直接读它启动,重接线时以它为起点。
#
# 解码纪律:与 tagent.yaml 同一个 strict 面(未知键拒启动),故只写宿主 schema 读取的键;
#   未接线键清单见 README「待接线清单」。
#
# 与 tagent.yaml 的差异仅三处:模型(glm-5,与训练侧一致) · 端点(本机 OpenAI 兼容
#   proxy 占位,rollout 侧注入实际地址时经 TAGENT_API_ENDPOINT 覆盖 entry) · 超时
#   (7200s,rollout 比对话长)。
# ============================================================================

provider: areal_proxy
model: glm-5
request_timeout_seconds: 7200

# ===== Provider 连接注册表 =====
providers:
  areal_proxy: { provider: openai, api_endpoint: "http://localhost:8000/v1", api_key_env: "ZAI_API_KEY" }
  zhipu:       { provider: openai, api_endpoint: "https://open.bigmodel.cn/api/coding/paas/v4", api_key_env: "ZAI_API_KEY" }
  deepseek:    { provider: openai, api_endpoint: "https://api.deepseek.com/v1", api_key_env: "DEEPSEEK_API_KEY" }

# ===== 治理闸(rollout 期间照常记录 critical 操作)=====
governance:
  enabled: true
  enforcement: warn
  dir: data/governance

# ===== Agent 配置(集合与 tagent.yaml 一致,仅模型/端点/超时长)=====
entry: tagent
prompt_dir: resources/prompts

agents:
  tagent:
    system_prompt:
      files: [AGENTS.md, SOUL.md, USER.md, TOOLS.md]
    tools:
      - { kind: tool, id: send }

  knowledge:
    provider: deepseek
    model: deepseek-flash
    system_prompt:
      files: [knowledge_agent.md, knowledge_backend.md]

  recall:
    system_prompt:
      files: [recall_agent.md]
    tools:
      - { kind: tool, id: recall_query }
      - { kind: tool, id: recall_get }
      - { kind: tool, id: recall_recent }
      - { kind: tool, id: recall_trace }

  action:
    system_prompt:
      files: [action_agent.md]

  plan:
    provider: zhipu
    model: glm-5.3
    system_prompt:
      files: [plan_agent.md]

  meditator:
    system_prompt:
      files: [meditator_agent.md]
    tools:
      - { kind: tool, id: send }

# ===== 应用专属配置 =====
app:
  wechat:
    config_dir: ".wechat-config"
    token_file: "token.json"
    context_token_dir: ".wechat-context-tokens"
    workspace_dir: ".tagent-workspace"
    # approvers: ["wxid_owner"]

# 待接线(本宿主不读,启用前须先在 host_runtime.go 接 schema 与装配):
#   memory / compress / meditation / max_tool_iterations / max_tokens / temperature /
#   thinking_enabled / compress_threshold,以及全部非 send 工具与子 agent 委派。
